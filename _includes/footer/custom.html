<script>
  document.addEventListener("DOMContentLoaded", function () {
    var themeLink = document.querySelector("#theme-toggle a");
    var navButton = document.querySelector("#site-nav > button");
    var hiddenLinks = document.querySelector("#site-nav .hidden-links");

    if (navButton && hiddenLinks) {
      navButton.addEventListener("click", function () {
        window.requestAnimationFrame(function () {
          var expanded = !hiddenLinks.classList.contains("hidden");
          navButton.setAttribute("aria-expanded", expanded ? "true" : "false");
          navButton.setAttribute("aria-label", expanded ? "Close navigation menu" : "Open navigation menu");
        });
      });
    }

    if (!themeLink) return;

    themeLink.addEventListener("click", function (event) {
      event.preventDefault();
    });

    themeLink.addEventListener("keydown", function (event) {
      if (event.key === " ") {
        event.preventDefault();
        themeLink.click();
      }
    });
  });
</script>
